name: Wool hourly watchdog

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hourly watchdog
        run: python3 scripts/wool_hourly.py
      - name: Commit feed changes if any
        run: |
          git config user.name "wool-feed-watchdog"
          git config user.email "wool-feed-watchdog@users.noreply.github.com"
          git add wool.json
          git diff --cached --quiet && echo "no feed change" && exit 0
          git commit -m "wool hourly watchdog: update feed"
          git push
